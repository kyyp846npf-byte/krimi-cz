<style>
/* Layout: sticky řada krajů s písmenem SPZ, pod ní mřížka karet; písmeno SPZ je poznávací znak kraje */
:root{
  --bg:#eef1f5;
  --surface:#ffffff;
  --ink:#14213a;
  --muted:#5a667c;
  --line:#d5dbe5;
  --accent:#c8102e;
  --accent-ink:#ffffff;
  --plate:#14213a;
  --plate-ink:#ffffff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1626;--surface:#17233a;--ink:#e8edf6;--muted:#9aa7bd;--line:#2a3a56;
    --accent:#ff5a70;--accent-ink:#0e1626;--plate:#e8edf6;--plate-ink:#0e1626;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1626;--surface:#17233a;--ink:#e8edf6;--muted:#9aa7bd;--line:#2a3a56;
  --accent:#ff5a70;--accent-ink:#0e1626;--plate:#e8edf6;--plate-ink:#0e1626;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1180px;margin-inline:auto}
header{padding-block:32px 20px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:900;font-stretch:80%;font-size:clamp(2.4rem,7vw,4.2rem);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.stamp{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;min-width:0}
.stamp b{color:var(--ink);font-weight:500;display:block}
nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:10px;border-block:1px solid var(--line);
}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{
  flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 .88rem var(--f-body);padding:5px 12px 5px 5px;border-radius:999px;cursor:pointer;
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.74rem;opacity:.65}
.plate{
  display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;
  background:var(--plate);color:var(--plate-ink);font:900 .95rem var(--f-display);
  box-shadow:inset 0 0 0 2px var(--plate-ink),inset 0 0 0 3px var(--plate);
}
.chip[aria-pressed="true"] .plate{background:var(--bg);color:var(--ink);box-shadow:none}
.chip.all .plate{font-size:.7rem}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;padding-block:24px 40px;
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;
  display:flex;flex-direction:column;gap:10px;min-width:0;
}
.card .top{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card h2{font-family:var(--f-display);font-weight:800;font-stretch:90%;font-size:1.28rem;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);flex:1;max-width:65ch}
.card a.more{
  align-self:flex-start;color:var(--accent);font-weight:600;text-decoration:none;
  border-bottom:2px solid currentColor;padding-bottom:1px;
}
.card a.more:hover{color:var(--ink)}
.card a.more:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.lead{grid-column:1/-1}
.lead h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.lead p{font-size:1.08rem}
footer{border-top:1px solid var(--line);padding-block:20px 40px;color:var(--muted);font-size:.85rem;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--ink)}}
</style>

</div>

var cur="*";
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function chips(){
  var c={};N.forEach(function(n){c[n.r]=(c[n.r]||0)+1});
  var h='<button class="chip all" id="chip-all" data-r="*" aria-pressed="'+(cur==="*")+'"><span class="plate">ČR</span>Všechny <span class="n">'+N.length+'</span></button>';

  });
  document.getElementById("chips").innerHTML=h;
}
function cards(){
  var list=N.filter(function(n){return cur==="*"||n.r===cur});
  document.getElementById("grid").innerHTML=list.map(function(n,i){
    return '<article class="card'+(i===0&&cur==="*"?' lead':'')+'"><div class="top"><span class="plate">'+n.r+'</span>'+R[n.r]+'</div><h2>'+esc(n.t)+'</h2><p>'+esc(n.s)+'</p><a class="more" href="'+B+n.u+'" target="_blank" rel="noopener">Číst na ČT24</a></article>';
  }).join("");
}
document.getElementById("chips").addEventListener("click",function(e){

  cur=b.getAttribute("data-r");chips();cards();
  try{document.getElementById("chip-"+(cur==="*"?"all":cur)).focus()}catch(x){}
});
chips();cards();
